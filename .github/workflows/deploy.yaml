name: Deploy

# genco on s3.goodserver.ch builds and deploys the pushed commit, this job
# starts the deploy and follows its log
on:
    push:
        branches: [live]
    workflow_dispatch:

concurrency: deploy

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy
              env:
                  GENCO: https://s3.goodserver.ch
                  GENCO_TOKEN: ${{ secrets.GENCO_TOKEN }}
              run: |
                  set -e
                  auth="Authorization: Bearer $GENCO_TOKEN"
                  id=$(curl -fsS -X POST "$GENCO/api/deploy" -H "$auth" \
                    -H "content-type: application/json" \
                    -d "{\"group\": \"chnobli\", \"ref\": \"$GITHUB_SHA\"}")
                  off=0
                  while :; do
                    d=$(curl -fsS "$GENCO/api/deploys/$id" -H "$auth")
                    curl -fsS -D h "$GENCO/api/deploys/$id/log?offset=$off" -H "$auth"
                    off=$(sed -n 's/^x-log-offset: *\([0-9]*\).*/\1/ip' h)
                    case $(echo "$d" | jq -r .status) in
                      done) [ "$(echo "$d" | jq -r .commitId)" = "$GITHUB_SHA" ] && exit 0
                        echo "superseded by $(echo "$d" | jq -r .ref)"; exit 1 ;;
                      failed) exit 1 ;;
                    esac
                    sleep 3
                  done
